---
# 시스템 최적화 및 자동 업데이트 비활성화 태스크
# 모든 플레이북에서 include_tasks로 사용

- name: Disable automatic updates (dnf-automatic timer)
  systemd:
    name: dnf-automatic.timer
    state: stopped
    enabled: no
  ignore_errors: yes

- name: Disable automatic updates (dnf-automatic-install timer)
  systemd:
    name: dnf-automatic-install.timer
    state: stopped
    enabled: no
  ignore_errors: yes

- name: Remove dnf-automatic package
  dnf:
    name: dnf-automatic
    state: absent
  ignore_errors: yes

- name: Disable PackageKit automatic updates
  lineinfile:
    path: /etc/PackageKit/PackageKit.conf
    regexp: '^CheckPeriod='
    line: 'CheckPeriod=never'
    create: yes
  ignore_errors: yes

- name: Disable yum-cron service
  systemd:
    name: yum-cron
    state: stopped
    enabled: no
  ignore_errors: yes

- name: Set SELinux to permissive (개발 환경용)
  selinux:
    policy: targeted
    state: permissive
  ignore_errors: yes

- name: Set timezone to Asia/Seoul
  timezone:
    name: Asia/Seoul

- name: Disable swap for Kubernetes compatibility
  shell: |
    swapoff -a
    sed -i '/ swap / s/^\(.*\)$/#\1/g' /etc/fstab
  ignore_errors: yes

- name: Display system optimization status
  debug:
    msg:
      - "=== 시스템 최적화 완료 ==="
      - "- 자동 업데이트: 비활성화 ✓"
      - "- SELinux: Permissive ✓"
      - "- Swap: 비활성화 ✓" 
      - "- Timezone: Asia/Seoul ✓"
