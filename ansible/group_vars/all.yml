---
# Environment Variables from config.yaml
# 이 파일은 setup-management.sh에서 자동 생성됩니다

# VM 접속 정보
root_password: "{{ lookup('file', '/vagrant/config.yaml') | from_yaml | json_query('ROOT_PASSWORD') }}"
admin_password: "{{ lookup('file', '/vagrant/config.yaml') | from_yaml | json_query('ADMIN_PASSWORD') }}"

# 네트워크 설정
mgmt_ip: "{{ lookup('file', '/vagrant/config.yaml') | from_yaml | json_query('MGMT_IP') }}"
sdn_ip: "{{ lookup('file', '/vagrant/config.yaml') | from_yaml | json_query('SDN_IP') }}"
app1_ip: "{{ lookup('file', '/vagrant/config.yaml') | from_yaml | json_query('APP1_IP') }}"

# 모니터링 설정
grafana_admin_user: "{{ lookup('file', '/vagrant/config.yaml') | from_yaml | json_query('GRAFANA_ADMIN_USER') }}"
grafana_admin_password: "{{ lookup('file', '/vagrant/config.yaml') | from_yaml | json_query('GRAFANA_ADMIN_PASSWORD') }}"
prometheus_retention: "{{ lookup('file', '/vagrant/config.yaml') | from_yaml | json_query('PROMETHEUS_RETENTION') }}"

# SDN 설정
sdn_user: "{{ lookup('file', '/vagrant/config.yaml') | from_yaml | json_query('SDN_USER') }}"
openflow_port: "{{ lookup('file', '/vagrant/config.yaml') | from_yaml | json_query('OPENFLOW_PORT') }}"
sdn_api_port: "{{ lookup('file', '/vagrant/config.yaml') | from_yaml | json_query('SDN_API_PORT') }}"
