---
# Kubernetes 클러스터 설정 플레이북
# ansible-playbook -i inventory/hosts.yml playbooks/setup-k8s-cluster.yml

- name: Initialize Kubernetes Master
  hosts: k8s_master
  become: yes
  vars:
    pod_network_cidr: "10.244.0.0/16"  # Flannel 기본 CIDR
    
  tasks:
    - name: Check if cluster is already initialized
      stat:
        path: /etc/kubernetes/admin.conf
      register: k8s_admin_conf

    - name: Initialize Kubernetes cluster
      shell: |
        kubeadm init \
          --apiserver-advertise-address={{ ansible_default_ipv4.address }} \
          --pod-network-cidr={{ pod_network_cidr }} \
          --node-name={{ ansible_hostname }}
      register: kubeadm_output
      when: not k8s_admin_conf.stat.exists

    - name: Create .kube directory for vagrant user
      file:
        path: /home/vagrant/.kube
        state: directory
        owner: vagrant
        group: vagrant
        mode: '0755'

    - name: Copy admin.conf to vagrant user
      copy:
        src: /etc/kubernetes/admin.conf
        dest: /home/vagrant/.kube/config
        owner: vagrant
        group: vagrant
        mode: '0644'
        remote_src: yes

    - name: Create .kube directory for admin user
      file:
        path: /home/admin/.kube
        state: directory
        owner: admin
        group: admin
        mode: '0755'

    - name: Copy admin.conf to admin user
      copy:
        src: /etc/kubernetes/admin.conf
        dest: /home/admin/.kube/config
        owner: admin
        group: admin
        mode: '0644'
        remote_src: yes

    - name: Install Flannel CNI
      shell: kubectl apply -f https://github.com/flannel-io/flannel/releases/latest/download/kube-flannel.yml
      become_user: vagrant
      environment:
        KUBECONFIG: /home/vagrant/.kube/config

    - name: Get join command
      shell: kubeadm token create --print-join-command
      register: join_command
      when: not k8s_admin_conf.stat.exists

    - name: Save join command to file
      copy:
        content: "{{ join_command.stdout }}"
        dest: /tmp/k8s-join-command
        mode: '0644'
      when: join_command.stdout is defined

    - name: Display join command
      debug:
        msg: "Join command: {{ join_command.stdout }}"
      when: join_command.stdout is defined

- name: Join Kubernetes Workers
  hosts: k8s_workers
  become: yes
  tasks:
    - name: Check if node is already joined
      stat:
        path: /etc/kubernetes/kubelet.conf
      register: kubelet_conf

    - name: Get join command from master
      slurp:
        src: /tmp/k8s-join-command
      register: join_command_content
      delegate_to: "{{ groups['k8s_master'][0] }}"
      when: not kubelet_conf.stat.exists

    - name: Join worker to cluster
      shell: "{{ join_command_content.content | b64decode | trim }}"
      when: 
        - not kubelet_conf.stat.exists
        - join_command_content.content is defined

    - name: Create .kube directory for vagrant user
      file:
        path: /home/vagrant/.kube
        state: directory
        owner: vagrant
        group: vagrant
        mode: '0755'

    - name: Copy admin.conf from master to worker
      copy:
        src: /etc/kubernetes/admin.conf
        dest: /home/vagrant/.kube/config
        owner: vagrant
        group: vagrant
        mode: '0644'
      delegate_to: "{{ groups['k8s_master'][0] }}"
      remote_src: yes

- name: Verify Cluster Status
  hosts: k8s_master
  become_user: vagrant
  tasks:
    - name: Wait for all nodes to be ready
      shell: kubectl get nodes --no-headers | grep -v Ready | wc -l
      register: not_ready_nodes
      until: not_ready_nodes.stdout == "0"
      retries: 30
      delay: 10

    - name: Display cluster nodes
      shell: kubectl get nodes -o wide
      register: cluster_nodes

    - name: Show cluster status
      debug:
        msg: "{{ cluster_nodes.stdout_lines }}"

    - name: Display cluster info
      shell: kubectl cluster-info
      register: cluster_info

    - name: Show cluster info
      debug:
        msg: "{{ cluster_info.stdout_lines }}"

    - name: Check pod status in kube-system namespace
      shell: kubectl get pods -n kube-system
      register: system_pods

    - name: Show system pods
      debug:
        msg: "{{ system_pods.stdout_lines }}"