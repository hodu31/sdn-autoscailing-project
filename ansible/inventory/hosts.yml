---
# Ansible 인벤토리 파일
# ansible/inventory/hosts.yml

all:
  vars:
    ansible_user: vagrant
    ansible_ssh_pass: rmajsTlq!
    ansible_become: yes
    ansible_become_pass: rmajsTlq!
    ansible_ssh_common_args: '-o StrictHostKeyChecking=no'
    
  children:
    management:
      hosts:
        mgmt-server:
          ansible_host: 192.168.100.10
          server_role: management
          services:
            - ansible_controller
            - prometheus
            - grafana
            - alertmanager
            - vpn_server
            - docker_registry
            
    sdn:
      hosts:
        sdn-controller:
          ansible_host: 192.168.100.20
          server_role: sdn_controller
          services:
            - ryu_controller
            - openvswitch
            - load_balancer
            - network_monitoring
            
    kubernetes:
      children:
        k8s_master:
          hosts:
            k8s-master:
              ansible_host: 192.168.100.30
              server_role: k8s_master
              services:
                - api_server
                - etcd
                - controller_manager
                - scheduler
                - ingress_controller
                
        k8s_workers:
          hosts:
            k8s-worker1:
              ansible_host: 192.168.100.31
              server_role: k8s_worker
              services:
                - kubelet
                - kube_proxy
                - container_runtime
                - node_exporter
                
            k8s-worker2:
              ansible_host: 192.168.100.32
              server_role: k8s_worker
              services:
                - kubelet
                - kube_proxy
                - container_runtime
                - node_exporter