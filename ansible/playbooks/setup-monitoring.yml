---
- name: Setup Monitoring Stack (Docker Pre-installed)
  hosts: management
  become: yes
  vars:
    monitoring_dir: /opt/monitoring
    
  tasks:
    # 시스템 최적화 (필요한 부분만)
    - include_tasks: ../tasks/system-optimization.yml

    # ===========================================
    # ✅ Docker 설치 상태 검증만 수행
    # ===========================================
    
    - name: Verify Docker is installed and running
      systemd:
        name: docker
        state: started
        enabled: yes

    - name: Verify Docker version
      command: docker --version
      register: docker_version
      changed_when: false

    - name: Verify Docker Compose is available
      shell: docker compose version || docker-compose --version
      register: compose_version
      changed_when: false

    - name: Display Docker status
      debug:
        msg:
          - "✅ Docker Status: {{ docker_version.stdout }}"
          - "✅ Compose Status: {{ compose_version.stdout_lines[0] }}"

    # ===========================================
    # 📁 모니터링 디렉토리 및 설정 파일 생성
    # ===========================================

    - name: Create monitoring directory structure
      file:
        path: "{{ monitoring_dir }}/{{ item }}"
        state: directory
        mode: '0755'
        owner: root
        group: root
      loop:
        - ""
        - prometheus
        - grafana/provisioning/datasources
        - grafana/provisioning/dashboards
        - grafana/dashboards
        - alertmanager

    - name: Create Prometheus configuration
      copy:
        content: |
          global:
            scrape_interval: 15s
            evaluation_interval: 15s
            external_labels:
              monitor: 'sdn-monitoring'

          rule_files:
            - "alert_rules.yml"

          alerting:
            alertmanagers:
              - static_configs:
                  - targets:
                    - alertmanager:9093

          scrape_configs:
            - job_name: 'prometheus'
              static_configs:
                - targets: ['localhost:9090']

            - job_name: 'node-exporter'
              static_configs:
                - targets: ['node-exporter:9100']

            - job_name: 'mgmt-server'
              static_configs:
                - targets: ['192.168.100.10:9100']
              scrape_interval: 30s

            - job_name: 'sdn-controller'
              static_configs:
                - targets: ['192.168.100.20:8080']
              scrape_interval: 30s

            - job_name: 'k8s-master'
              static_configs:
                - targets: ['192.168.100.30:9100']
              scrape_interval: 30s

            - job_name: 'k8s-workers'
              static_configs:
                - targets: ['192.168.100.31:9100', '192.168.100.32:9100']
              scrape_interval: 30s
        dest: "{{ monitoring_dir }}/prometheus/prometheus.yml"
        mode: '0644'
      notify: restart_prometheus

    - name: Create Prometheus alert rules
      copy:
        content: |
          groups:
            - name: infrastructure_alerts
              rules:
                - alert: NodeDown
                  expr: up == 0
                  for: 1m
                  labels:
                    severity: critical
                  annotations:
                    summary: "Node {{ $labels.instance }} is down"
                    description: "{{ $labels.instance }} has been down for more than 1 minute"

                - alert: HighCPUUsage
                  expr: 100 - (avg by(instance) (irate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
                  for: 2m
                  labels:
                    severity: warning
                  annotations:
                    summary: "High CPU usage on {{ $labels.instance }}"
                    description: "CPU usage is {{ $value | humanize }}% for more than 2 minutes"

                - alert: HighMemoryUsage
                  expr: (node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes) / node_memory_MemTotal_bytes * 100 > 85
                  for: 5m
                  labels:
                    severity: warning
                  annotations:
                    summary: "High memory usage on {{ $labels.instance }}"
                    description: "Memory usage is {{ $value | humanize }}% for more than 5 minutes"

                - alert: DiskSpaceLow
                  expr: (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) * 100 < 10
                  for: 5m
                  labels:
                    severity: critical
                  annotations:
                    summary: "Disk space low on {{ $labels.instance }}"
                    description: "Disk space is {{ $value | humanize }}% remaining"

                - alert: DockerContainerDown
                  expr: engine_daemon_container_states_containers{state="running"} < 4
                  for: 2m
                  labels:
                    severity: warning
                  annotations:
                    summary: "Docker container is down"
                    description: "One or more monitoring containers are not running"
        dest: "{{ monitoring_dir }}/prometheus/alert_rules.yml"
        mode: '0644'
      notify: restart_prometheus

    - name: Create Grafana datasource configuration
      copy:
        content: |
          apiVersion: 1
          
          datasources:
            - name: Prometheus
              type: prometheus
              access: proxy
              url: http://prometheus:9090
              isDefault: true
              editable: true
              jsonData:
                timeInterval: "15s"
                queryTimeout: "60s"
                httpMethod: "POST"
        dest: "{{ monitoring_dir }}/grafana/provisioning/datasources/prometheus.yml"
        mode: '0644'

    - name: Create Grafana dashboard provisioning
      copy:
        content: |
          apiVersion: 1
          
          providers:
            - name: 'Infrastructure Dashboards'
              orgId: 1
              folder: 'Infrastructure'
              type: file
              disableDeletion: false
              editable: true
              updateIntervalSeconds: 30
              options:
                path: /var/lib/grafana/dashboards
        dest: "{{ monitoring_dir }}/grafana/provisioning/dashboards/dashboard.yml"
        mode: '0644'

    - name: Create AlertManager configuration
      copy:
        content: |
          global:
            resolve_timeout: 5m

          route:
            group_by: ['alertname', 'cluster', 'service']
            group_wait: 10s
            group_interval: 10s
            repeat_interval: 12h
            receiver: 'default-receiver'
            routes:
              - match:
                  severity: critical
                receiver: 'critical-receiver'
                repeat_interval: 5m

          receivers:
            - name: 'default-receiver'
              webhook_configs:
                - url: 'http://192.168.100.10:5001/webhook'
                  send_resolved: true
                  title: '{{ range .Alerts }}{{ .Annotations.summary }}{{ end }}'
                  text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'

            - name: 'critical-receiver'
              webhook_configs:
                - url: 'http://192.168.100.10:5001/webhook/critical'
                  send_resolved: true
                  title: '🚨 CRITICAL: {{ range .Alerts }}{{ .Annotations.summary }}{{ end }}'
                  text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'

          inhibit_rules:
            - source_match:
                severity: 'critical'
              target_match:
                severity: 'warning'
              equal: ['alertname', 'instance']
        dest: "{{ monitoring_dir }}/alertmanager/alertmanager.yml"
        mode: '0644'
      notify: restart_alertmanager

    # ===========================================
    # 🐳 최적화된 Docker Compose 파일
    # ===========================================

    - name: Create optimized Docker Compose file
      copy:
        content: |
          version: '3.8'

          services:
            prometheus:
              image: prom/prometheus:v2.45.0
              container_name: prometheus
              restart: unless-stopped
              ports:
                - "9090:9090"
              volumes:
                - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
                - ./prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
                - prometheus_data:/prometheus
              command:
                - '--config.file=/etc/prometheus/prometheus.yml'
                - '--storage.tsdb.path=/prometheus'
                - '--storage.tsdb.retention.time=168h'  # 7일 보관
                - '--storage.tsdb.retention.size=1GB'   # 최대 1GB
                - '--web.enable-lifecycle'
                - '--web.enable-admin-api'
                - '--web.external-url=http://192.168.100.10:9090'
              networks:
                - monitoring
              healthcheck:
                test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
                interval: 30s
                timeout: 10s
                retries: 3
                start_period: 40s

            grafana:
              image: grafana/grafana:10.0.0
              container_name: grafana
              restart: unless-stopped
              ports:
                - "3000:3000"
              volumes:
                - grafana_data:/var/lib/grafana
                - ./grafana/provisioning:/etc/grafana/provisioning:ro
              environment:
                - GF_SECURITY_ADMIN_USER=admin
                - GF_SECURITY_ADMIN_PASSWORD=admin123
                - GF_USERS_ALLOW_SIGN_UP=false
                - GF_ANALYTICS_REPORTING_ENABLED=false
                - GF_ANALYTICS_CHECK_FOR_UPDATES=false
                - GF_LOG_LEVEL=warn
                - GF_SERVER_ROOT_URL=http://192.168.100.10:3000
                - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/infrastructure.json
              networks:
                - monitoring
              depends_on:
                prometheus:
                  condition: service_healthy
              healthcheck:
                test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
                interval: 30s
                timeout: 10s
                retries: 3
                start_period: 40s

            alertmanager:
              image: prom/alertmanager:v0.25.0
              container_name: alertmanager
              restart: unless-stopped
              ports:
                - "9093:9093"
              volumes:
                - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
                - alertmanager_data:/alertmanager
              command:
                - '--config.file=/etc/alertmanager/alertmanager.yml'
                - '--storage.path=/alertmanager'
                - '--web.external-url=http://192.168.100.10:9093'
                - '--cluster.listen-address='
              networks:
                - monitoring
              healthcheck:
                test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9093/-/healthy"]
                interval: 30s
                timeout: 10s
                retries: 3
                start_period: 30s

            node-exporter:
              image: prom/node-exporter:v1.6.0
              container_name: node-exporter
              restart: unless-stopped
              ports:
                - "9100:9100"
              volumes:
                - /proc:/host/proc:ro
                - /sys:/host/sys:ro
                - /:/rootfs:ro
                - /etc/hostname:/etc/nodename:ro
              command:
                - '--path.procfs=/host/proc'
                - '--path.rootfs=/rootfs'
                - '--path.sysfs=/host/sys'
                - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc|rootfs/var/lib/docker/containers|rootfs/var/lib/docker/overlay2|rootfs/run/docker/netns|rootfs/var/lib/docker/aufs)($$|/)'
                - '--collector.netdev.device-exclude=^(veth.*|docker.*|br-.*|lo)$$'
                - '--web.telemetry-path=/metrics'
              networks:
                - monitoring

          volumes:
            prometheus_data:
              driver: local
            grafana_data:
              driver: local
            alertmanager_data:
              driver: local

          networks:
            monitoring:
              driver: bridge
              ipam:
                config:
                  - subnet: 172.20.0.0/16
        dest: "{{ monitoring_dir }}/docker-compose.yml"
        mode: '0644'
      notify: restart_monitoring_stack

    # ===========================================
    # 🔥 방화벽 설정
    # ===========================================

    - name: Configure firewall for monitoring services
      firewalld:
        port: "{{ item }}/tcp"
        permanent: yes
        state: enabled
        immediate: yes
      loop:
        - 3000   # Grafana
        - 9090   # Prometheus
        - 9093   # AlertManager
        - 9100   # Node Exporter
        - 5001   # Webhook API

    # ===========================================
    # 🚀 서비스 시작 및 검증
    # ===========================================

    - name: Start monitoring stack
      shell: |
        cd {{ monitoring_dir }}
        docker compose up -d --remove-orphans
      register: compose_result

    - name: Wait for all services to be healthy
      shell: |
        cd {{ monitoring_dir }}
        timeout 300 bash -c 'while [[ $(docker compose ps --format json | jq -r ".[].Health" | grep -v "healthy\|null" | wc -l) -gt 0 ]]; do echo "Waiting for services to be healthy..."; sleep 10; done'
      register: health_check
      changed_when: false

    - name: Verify services are responding
      uri:
        url: "{{ item.url }}"
        method: GET
        status_code: 200
        timeout: 10
      loop:
        - { url: "http://192.168.100.10:3000/api/health", name: "Grafana" }
        - { url: "http://192.168.100.10:9090/-/healthy", name: "Prometheus" }
        - { url: "http://192.168.100.10:9093/-/healthy", name: "AlertManager" }
        - { url: "http://192.168.100.10:9100/metrics", name: "Node Exporter" }
      retries: 5
      delay: 10

    - name: Display final status
      debug:
        msg:
          - "🎉 === 모니터링 스택 구축 완료 === 🎉"
          - ""
          - "🌐 접속 정보:"
          - "   📊 Grafana UI: http://192.168.100.10:3000"
          - "   👤 Username: admin"
          - "   🔑 Password: admin123"
          - ""
          - "   📈 Prometheus: http://192.168.100.10:9090"
          - "   🔔 AlertManager: http://192.168.100.10:9093"
          - "   💻 Node Metrics: http://192.168.100.10:9100/metrics"
          - ""
          - "🔧 관리 명령어:"
          - "   cd {{ monitoring_dir }}"
          - "   docker compose ps        # 상태 확인"
          - "   docker compose logs -f   # 로그 확인"
          - "   docker compose restart   # 재시작"

  # ===========================================
  # 📢 Handlers
  # ===========================================
  
  handlers:
    - name: restart_prometheus
      shell: |
        cd {{ monitoring_dir }}
        docker compose restart prometheus
      
    - name: restart_alertmanager
      shell: |
        cd {{ monitoring_dir }}
        docker compose restart alertmanager
      
    - name: restart_monitoring_stack
      shell: |
        cd {{ monitoring_dir }}
        docker compose restart