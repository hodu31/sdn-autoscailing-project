---
- name: Setup SDN Controller (Native Installation)
  hosts: sdn_controllers
  become: yes
  vars:
    sdn_user: sdn
    sdn_home: /home/sdn
    
  tasks:
    # 시스템 최적화 및 자동 업데이트 비활성화
    - include_tasks: ../tasks/system-optimization.yml
    
    - name: Install SDN Controller dependencies
      dnf:
        name:
          - epel-release
          - python3
          - python3-pip
          - python3-devel
          - gcc
          - make
          - git
          - openvswitch
          - python3-openvswitch
          - bridge-utils
          - net-tools
        state: present

    - name: Create SDN user
      user:
        name: "{{ sdn_user }}"
        shell: /bin/bash
        home: "{{ sdn_home }}"
        create_home: yes

    - name: Install Python SDN libraries
      pip:
        name:
          - ryu
          - eventlet
          - netaddr
          - flask
          - requests
        executable: pip3

    - name: Start and enable Open vSwitch
      systemd:
        name: openvswitch
        state: started
        enabled: yes

    - name: Create SDN application directory
      file:
        path: "{{ sdn_home }}/sdn-apps"
        state: directory
        owner: "{{ sdn_user }}"
        group: "{{ sdn_user }}"
        mode: '0755'

    - name: Create basic SDN controller application
      copy:
        content: |
          from ryu.base import app_manager
          from ryu.controller import ofp_event
          from ryu.controller.handler import CONFIG_DISPATCHER, MAIN_DISPATCHER
          from ryu.controller.handler import set_ev_cls
          from ryu.ofproto import ofproto_v1_3
          from ryu.lib.packet import packet
          from ryu.lib.packet import ethernet
          from ryu.lib.packet import ether_types
          from ryu.app.wsgi import ControllerBase, WSGIApplication, route
          from webob import Response
          import json

          class LoadBalancerController(app_manager.RyuApp):
              OFP_VERSIONS = [ofproto_v1_3.OFP_VERSION]
              _CONTEXTS = {'wsgi': WSGIApplication}

              def __init__(self, *args, **kwargs):
                  super(LoadBalancerController, self).__init__(*args, **kwargs)
                  self.mac_to_port = {}
                  self.backend_servers = []
                  self.current_server = 0
                  
                  # Web API 설정
                  wsgi = kwargs['wsgi']
                  wsgi.register(LoadBalancerAPI, {'controller': self})

              @set_ev_cls(ofp_event.EventOFPSwitchFeatures, CONFIG_DISPATCHER)
              def switch_features_handler(self, ev):
                  datapath = ev.msg.datapath
                  ofproto = datapath.ofproto
                  parser = datapath.ofproto_parser

                  # Install table-miss flow entry
                  match = parser.OFPMatch()
                  actions = [parser.OFPActionOutput(ofproto.OFPP_CONTROLLER,
                                                  ofproto.OFPCML_NO_BUFFER)]
                  self.add_flow(datapath, 0, match, actions)
                  self.logger.info("Switch %s connected", datapath.id)

              def add_flow(self, datapath, priority, match, actions):
                  ofproto = datapath.ofproto
                  parser = datapath.ofproto_parser

                  inst = [parser.OFPInstructionActions(ofproto.OFPIT_APPLY_ACTIONS,
                                                     actions)]
                  mod = parser.OFPFlowMod(datapath=datapath, priority=priority,
                                        match=match, instructions=inst)
                  datapath.send_msg(mod)

              @set_ev_cls(ofp_event.EventOFPPacketIn, MAIN_DISPATCHER)
              def packet_in_handler(self, ev):
                  msg = ev.msg
                  datapath = msg.datapath
                  ofproto = datapath.ofproto
                  parser = datapath.ofproto_parser
                  in_port = msg.match['in_port']

                  pkt = packet.Packet(msg.data)
                  eth = pkt.get_protocols(ethernet.ethernet)[0]

                  if eth.ethertype == ether_types.ETH_TYPE_LLDP:
                      return

                  dst = eth.dst
                  src = eth.src
                  dpid = datapath.id
                  self.mac_to_port.setdefault(dpid, {})

                  # Learn MAC address
                  self.mac_to_port[dpid][src] = in_port

                  if dst in self.mac_to_port[dpid]:
                      out_port = self.mac_to_port[dpid][dst]
                  else:
                      out_port = ofproto.OFPP_FLOOD

                  actions = [parser.OFPActionOutput(out_port)]

                  # Install flow if not flooding
                  if out_port != ofproto.OFPP_FLOOD:
                      match = parser.OFPMatch(in_port=in_port, eth_dst=dst, eth_src=src)
                      self.add_flow(datapath, 1, match, actions)

                  data = None
                  if msg.buffer_id == ofproto.OFP_NO_BUFFER:
                      data = msg.data

                  out = parser.OFPPacketOut(datapath=datapath, buffer_id=msg.buffer_id,
                                          in_port=in_port, actions=actions, data=data)
                  datapath.send_msg(out)

              def add_backend_server(self, server_ip):
                  if server_ip not in self.backend_servers:
                      self.backend_servers.append(server_ip)
                      self.logger.info("Added backend server: %s", server_ip)

              def remove_backend_server(self, server_ip):
                  if server_ip in self.backend_servers:
                      self.backend_servers.remove(server_ip)
                      self.logger.info("Removed backend server: %s", server_ip)

              def get_next_server(self):
                  if not self.backend_servers:
                      return None
                  server = self.backend_servers[self.current_server]
                  self.current_server = (self.current_server + 1) % len(self.backend_servers)
                  return server

          class LoadBalancerAPI(ControllerBase):
              def __init__(self, req, link, data, **config):
                  super(LoadBalancerAPI, self).__init__(req, link, data, **config)
                  self.controller = data['controller']

              @route('loadbalancer', '/servers', methods=['GET'])
              def get_servers(self, req, **kwargs):
                  return Response(content_type='application/json',
                                body=json.dumps(self.controller.backend_servers))

              @route('loadbalancer', '/servers/{server_ip}', methods=['POST'])
              def add_server(self, req, **kwargs):
                  server_ip = kwargs['server_ip']
                  self.controller.add_backend_server(server_ip)
                  return Response(status=201)

              @route('loadbalancer', '/servers/{server_ip}', methods=['DELETE'])
              def remove_server(self, req, **kwargs):
                  server_ip = kwargs['server_ip']
                  self.controller.remove_backend_server(server_ip)
                  return Response(status=204)

              @route('loadbalancer', '/status', methods=['GET'])
              def get_status(self, req, **kwargs):
                  status = {
                      'servers': self.controller.backend_servers,
                      'current_server_index': self.controller.current_server,
                      'total_switches': len(self.controller.mac_to_port)
                  }
                  return Response(content_type='application/json',
                                body=json.dumps(status))
        dest: "{{ sdn_home }}/sdn-apps/load_balancer.py"
        owner: "{{ sdn_user }}"
        group: "{{ sdn_user }}"
        mode: '0644'

    - name: Create systemd service for SDN controller
      copy:
        content: |
          [Unit]
          Description=Ryu SDN Controller
          After=network.target openvswitch.service

          [Service]
          Type=simple
          User={{ sdn_user }}
          Group={{ sdn_user }}
          WorkingDirectory={{ sdn_home }}
          ExecStart=/usr/bin/ryu-manager --wsapi-host 0.0.0.0 --wsapi-port 8080 {{ sdn_home }}/sdn-apps/load_balancer.py
          Restart=always

          [Install]
          WantedBy=multi-user.target
        dest: /etc/systemd/system/ryu-controller.service

    - name: Open firewall ports for SDN controller
      firewalld:
        port: "{{ item }}/tcp"
        permanent: yes
        state: enabled
      loop:
        - 6653   # OpenFlow
        - 8080   # Ryu Web API

    - name: Reload firewall
      command: firewall-cmd --reload

    - name: Reload systemd daemon
      systemd:
        daemon_reload: yes

    - name: Start and enable SDN controller service
      systemd:
        name: ryu-controller
        state: started
        enabled: yes

    - name: Create basic network topology
      shell: |
        ovs-vsctl --if-exists del-br br0
        ovs-vsctl add-br br0
        ovs-vsctl set-controller br0 tcp:127.0.0.1:6653
        ovs-vsctl set bridge br0 protocols=OpenFlow13
      register: ovs_result

    - name: Wait for SDN controller to start
      wait_for:
        port: 8080
        host: 192.168.100.20
        delay: 5
        timeout: 30

    - name: Display SDN controller status
      debug:
        msg:
          - "=== SDN Controller 설치 완료 ==="
          - "OpenFlow Controller: tcp://192.168.100.20:6653"
          - "Web API: http://192.168.100.20:8080"
          - "Control: sudo systemctl {start|stop|restart|status} ryu-controller"
