global:
  scrape_interval: 15s
  evaluation_interval: 15s

# 알림 규칙 파일
rule_files:
  - "alert-rules.yml"

# AlertManager 설정
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

# 스크래핑 설정
scrape_configs:
  # Prometheus 자체 모니터링
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Management Server
  - job_name: 'mgmt-server'
    static_configs:
      - targets: ['192.168.100.10:9100']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'mgmt-server'

  # SDN Controller
  - job_name: 'sdn-controller'
    static_configs:
      - targets: ['192.168.100.20:9100']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'sdn-controller'

  # Kubernetes Master
  - job_name: 'k8s-master'
    static_configs:
      - targets: ['192.168.100.30:9100']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'k8s-master'

  # Kubernetes Workers
  - job_name: 'k8s-workers'
    static_configs:
      - targets: 
        - '192.168.100.31:9100'
        - '192.168.100.32:9100'
    relabel_configs:
      - source_labels: [__address__]
        regex: '192.168.100.31:9100'
        target_label: instance
        replacement: 'k8s-worker1'
      - source_labels: [__address__]
        regex: '192.168.100.32:9100'
        target_label: instance
        replacement: 'k8s-worker2'

  # Kubernetes API Server
  - job_name: 'kubernetes-apiservers'
    kubernetes_sd_configs:
      - role: endpoints
        api_server: 'https://192.168.100.30:6443'
        tls_config:
          insecure_skip_verify: true
    scheme: https
    tls_config:
      insecure_skip_verify: true
    relabel_configs:
      - source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_service_name, __meta_kubernetes_endpoint_port_name]
        action: keep
        regex: default;kubernetes;https

  # Kubernetes Nodes
  - job_name: 'kubernetes-nodes'
    kubernetes_sd_configs:
      - role: node
        api_server: 'https://192.168.100.30:6443'
        tls_config:
          insecure_skip_verify: true
    scheme: https
    tls_config:
      insecure_skip_verify: true
    relabel_configs:
      - action: labelmap
        regex: __meta_kubernetes_node_label_(.+)

  # Kubernetes Pods
  - job_name: 'kubernetes-pods'
    kubernetes_sd_configs:
      - role: pod
        api_server: 'https://192.168.100.30:6443'
        tls_config:
          insecure_skip_verify: true
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        action: keep
        regex: true
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
        action: replace
        target_label: __metrics_path__
        regex: (.+)
      - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
        action: replace
        regex: ([^:]+)(?::\d+)?;(\d+)
        replacement: $1:$2
        target_label: __address__
      - action: labelmap
        regex: __meta_kubernetes_pod_label_(.+)
      - source_labels: [__meta_kubernetes_namespace]
        action: replace
        target_label: kubernetes_namespace
      - source_labels: [__meta_kubernetes_pod_name]
        action: replace
        target_label: kubernetes_pod_name

  # cAdvisor (컨테이너 메트릭)
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['localhost:8080']